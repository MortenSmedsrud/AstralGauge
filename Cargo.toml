[package]
name = "astral-gauge"
version = "0.1.0"
edition = "2021"

[dependencies]
# eframe 0.36 defaults to the wgpu renderer; keep the 0.31-era glow
# (OpenGL) backend explicitly, plus the remaining default features.
eframe = {
    version = "0.36",
    default-features = false,
    features = [
        "accesskit",
        "default_fonts",
        "glow",
        "links",
        "wayland",
        "web_screen_reader",
        "x11",
    ],
}
# eframe 0.36 dropped `winit/default`; this direct dep re-enables the
# features that used to come with it, with `default-features = false`
# so nothing else re-adds them — notably the default CSD font backend
# `ab_glyph` → unmaintained `ttf-parser` (RUSTSEC-2026-0192) stays out
# of the graph. The Adwaita CSD is kept via the `crossfont` backend
# (system fontconfig fonts) instead. Cost: building the CSD needs a C
# compiler (crossfont builds a bundled FreeType) and libfontconfig-dev,
# on top of the ALSA dev packages.
winit = {
    version = "0.30",
    default-features = false,
    features = [
        "rwh_06",
        "wayland-csd-adwaita-crossfont",
        "wayland-dlopen",
        "wayland",
        "x11",
    ],
}
libc = "0.2"
rodio = "0.20"
